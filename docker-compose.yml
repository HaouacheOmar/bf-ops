version: '3.8'

services:
  db:
    image: postgres:16
    container_name: bfops_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-bfops_db}
      POSTGRES_USER: ${DJANGO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: bfops_backend
    env_file:
      - .env
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./bfops:/app
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: bfops_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front/bFOPSSYS:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
